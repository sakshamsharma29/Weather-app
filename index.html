<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App (Full Stack)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Weather App</h1>
        <p>Full-stack weather dashboard powered by your own backend API.</p>
      </header>

      <section class="controls">
        <form id="search-form">
          <input
            id="city-input"
            type="text"
            placeholder="Search city (e.g. London)"
            required
          />
          <button type="submit">Search</button>
          <button type="button" id="current-location-btn">Use My Location</button>
        </form>
        <p id="status" class="status"></p>
      </section>

      <section id="weather-card" class="weather-card hidden">
        <div class="card-top">
          <h2 id="location-name"></h2>
          <p id="weather-main"></p>
        </div>

        <div class="card-main">
          <div class="temp-block">
            <p id="temperature" class="temperature"></p>
            <p id="feels-like"></p>
          </div>
          <img id="icon" alt="Weather icon" />
        </div>

        <div class="details-grid">
          <div><span>Humidity</span><strong id="humidity"></strong></div>
          <div><span>Wind</span><strong id="wind"></strong></div>
          <div><span>Pressure</span><strong id="pressure"></strong></div>
          <div><span>Visibility</span><strong id="visibility"></strong></div>
        </div>

        <p id="updated-at" class="muted"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
